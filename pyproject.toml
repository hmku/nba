[project]
name = "fantasy"
version = "0.1.0"
description = "Autonomous fantasy basketball optimization engine (Yahoo H2H 9-cat)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
nba = ["nba_api>=1.5"]
# training the value-search model only (draft-time inference is numpy): python -m fantasy.valuesearch.train
valuesearch = ["scikit-learn==1.5.2"]

[project.scripts]
fantasy = "fantasy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
