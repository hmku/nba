[project]
name = "fantasy"
version = "0.1.0"
description = "Autonomous fantasy basketball optimization engine (Yahoo H2H 9-cat)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
# ruff/mypy pinned to a minor: their rule sets change between releases (CI must match local)
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.*", "mypy==2.4.*"]
nba = ["nba_api>=1.5"]
# training the value-search model only (draft-time inference is numpy): python -m fantasy.valuesearch.train
valuesearch = ["scikit-learn==1.5.2"]

[project.scripts]
fantasy = "fantasy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # test this checkout even when the editable install points at another worktree
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end tests taking more than ~20 s (run with `pytest -m slow`)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
# CI type-checks the clean subset only (.github/workflows/ci.yml); grow it module by module.
ignore_missing_imports = true
